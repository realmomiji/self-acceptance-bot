<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自己受容BOT</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f5f0;
      --ink: #28231f;
      --muted: #6f6860;
      --line: #ddd5cb;
      --panel: #fffdf8;
      --accent: #2f7d69;
      --accent-dark: #1f5e4e;
      --soft: #e7f2ee;
      --warn: #b45b38;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 520px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 16px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      padding: 8px 2px 0;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 24px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .bot {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: start;
      margin-top: 4px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-weight: 700;
      font-size: 15px;
    }

    .bubble {
      min-height: 160px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 28px rgba(60, 45, 30, 0.08);
    }

    .label {
      margin-bottom: 10px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 700;
    }

    #phrase {
      margin: 0;
      font-size: 21px;
      line-height: 1.65;
      font-weight: 700;
    }

    .repeat {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .repeat.show {
      display: block;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: translateY(1px);
    }

    button.secondary {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
    }

    section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    h2 {
      margin: 4px 0 0;
      font-size: 15px;
      letter-spacing: 0;
    }

    .moods {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .moods button {
      background: var(--soft);
      color: var(--accent-dark);
    }

    .log {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 248, 0.68);
    }

    .log p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      line-height: 1.6;
    }

    textarea:focus {
      outline: 3px solid rgba(47, 125, 105, 0.18);
      border-color: var(--accent);
    }

    .tiny {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 360px) {
      main {
        padding-inline: 12px;
      }

      #phrase {
        font-size: 19px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>自己受容BOT</h1>
      <p class="sub">今の自分を責める前に、短い言葉をひとつ差し込みます。</p>
    </header>

    <div class="bot" aria-live="polite">
      <div class="avatar">受</div>
      <div class="bubble">
        <div class="label" id="modeLabel">今日の一言</div>
        <p id="phrase"></p>
        <div class="repeat" id="repeatText"></div>
      </div>
    </div>

    <div class="controls">
      <button id="randomBtn">次の言葉</button>
      <button class="secondary" id="repeatBtn">3回反復</button>
    </div>

    <section>
      <h2>今の気分</h2>
      <div class="moods">
        <button data-mood="anxiety">不安</button>
        <button data-mood="selfBlame">自己否定</button>
        <button data-mood="failure">失敗</button>
        <button data-mood="tired">疲れた</button>
      </div>
    </section>

    <section>
      <h2>ひとこと入力</h2>
      <textarea id="note" placeholder="例：また失敗して、自分が嫌になった"></textarea>
      <button class="secondary" id="reframeBtn">自己受容の言葉に変える</button>
      <div class="log">
        <p id="reframeResult">入力すると、責める言葉を少しやわらかく言い換えます。</p>
      </div>
    </section>

    <p class="tiny">これは簡易プロトタイプです。医療的な診断や治療ではなく、日々のセルフトークを整えるための小さな道具として使ってください。</p>
  </main>

  <script>
    const phrases = [
      `「今、私はこう感じている」と事実だけを実況中継し、感情にネガティブなレッテルを貼るのをやめてみましょう。`,
      `「諸行無常」という考え方を思い出し、今の苦しみも変化し続けるプロセスの一部として眺めてみてください。`,
      `自分の中の嫌いな部分も、自分を守るための素朴な機能として捉え直してみましょう。`,
      `「私はダメだ」という思い込みを、「私は、自分をダメだという思考を持っている」という客観的な事実として置き換えてください。`,
      `どうにもならない状況に直面したとき、それに抵抗せず、一度手放す練習をしてみましょう。`,
      `朝起きたとき、鏡に映る自分に「今日も、どんなあなたでも私はあなたの味方だよ」と心の中で声をかけてください。`,
      `「自分が自分の味方でなければ、誰が味方になってくれるのか」を、生存の基本原則として心に刻みましょう。`,
      `頭の中の批判する声が聴こえ始めたら、その声を小さな子どものわがままだと思って聞き流してください。`,
      `不安を感じるのは、脳の警戒システムが正常に作動しているだけだと科学的に理解しましょう。`,
      `セルフコンパッションのワークとして、親友にかけるような優しい言葉を、自分自身に贈ってください。`,
      `「自分を責める」という行為は、過去の経験から受け継いだ古い防衛パターンの残りカスだと割り切って捨ててみましょう。`,
      `「不完全である勇気」を持ち、今の不完全な状態こそが人間らしさであると定義し直してください。`,
      `1日1回、コンビニの棚の前で「誰のためでもなく、今の私の体がおいしいと感じるもの」を直感で選んでください。`,
      `瞑想中に浮かんできた雑念を、空に浮かぶ雲のように、ただ「流れていくもの」として追いかけない練習をしましょう。`,
      `境界線を引き、他人の期待に応えられない自分に対しても「まあ、いいか」と許可を出してください。`,
      `自分を否定したくなった時、あえて「今日まで生き抜いてきた生命力はすごいよな」と生命体としての自分を讃えましょう。`,
      `どんなに迷走した自分であっても、いつでも自分自身の元へ帰ってきて良いと許可しましょう。`,
      `「べき」という言葉を、「たい（欲求）」か「まあ、いつか（受容）」のどちらかに置き換える習慣をつけてください。`,
      `自己受容は「諦め」ではなく、次のステップに進むための「現在地の確認」であると捉え直しましょう。`,
      `怒りや嫉妬が湧いたとき、それを排除せず「それだけ一生懸命生きているんだな」と情熱の表れとして認めましょう。`,
      `マインドフルネスの視点で、呼吸が肺に入り、出ていく感覚だけに集中し、ただ「存在していること」を肯定してください。`,
      `失敗した時は「これは貴重なデータ収集だ」と、科学者のようなドライな視点で自分を評価から解放しましょう。`,
      `「私は私のままでいい」という言葉に違和感があるなら、「私は今の私以外にはなれない」という物理的事実を認めてください。`,
      `1日の終わりに、できたことではなく「嫌なことがあったのに、自分を見捨てなかったこと」を最大限に評価しましょう。`,
      `自分の性質のハードな面を、自分を苦しめる呪いではなく、使いこなすべき「高出力のエンジン」だと考えましょう。`,
      `調子が良い時も悪い時も、それが自然な摂理だと受け流してください。`,
      `「自己受容できない自分」に気づいた時こそ、最大のチャンスです。「そんな自分も、ま、ええか」と二重に受容しましょう。`,
      `どんな過去があろうとも、今この瞬間「呼吸」ができている自分は、生きていることに値すると信じてください。`,
      `お金への不安があっても、自己受容は不安と共存する力をくれます。この二つの関係は人生における必須科目です。`,
      `豊かさとは何も持っていない時でも「自分はこれでええやん」と言える心の筋肉のことだと理解しましょう。`,
      `外側の豊かさを増やす前に、内側の「自分という存在」を無条件で認める投資をすることが人生の最優先事項です。`,
      `お金があると悩みは消えると思いがちですが、心のOSを書き換えない限り、不安の場所が変わるだけだと知りましょう。`,
      `自己受容をマスターすれば、人生は内側から輝き始め、他人の評価という物差しが不要になる解放感を味わえます。`,
      `宇宙や壮大な自然の学びは「ちっぽけな自分」への絶望ではなく、大きな物語の一部であるという人生の解放への近道です。`,
      `冷水シャワーや深い呼吸で自律神経を刺激し、思考を通さずに「生き物としての安心感」を体に直接叩き込みましょう。`,
      `堂々とした姿勢をとるパワーポージングは、数分でストレスホルモンを下げ、自分を受け入れる準備を整えます。`,
      `「鈍さ」や「不安」はかつて自分を救った生存戦略の証であり、あなたの欠点は愛すべき適応性です。`,
      `現代の生きづらさは「数万年前の脳で現代を生きるギャップ」によるものであり、あなたのせいではないと断言しましょう。`,
      `人生を「被害者の記録」ではなく、初期設定を乗り越えて生き抜く「自分自身の英雄の旅」と再定義します。`,
      `自分のドロドロした感情を紙や絵にぶつけ、アウトサイダー・アートのようにその存在を大切にしてあげてください。`,
      `欠けた器に美を見出す「侘び寂び」のように、自分の心の傷を唯一無二の風合いとして美学的に肯定しましょう。`,
      `幼少期の影響で傷に気づいたら、大人の自分が幼い自分を抱きしめるイメージワークを行ってください。`
    ];

    const moodPhrases = {
      anxiety: [
        "不安があっても大丈夫。不安と一緒に、今できる呼吸だけをします。",
        "未来を全部解決しなくていい。今この瞬間の私を守ればいい。",
        "不安は敵ではなく、守ろうとしてくれている反応です。"
      ],
      selfBlame: [
        "責める声が出てきても、それは古い防衛パターンです。今の私の価値ではありません。",
        "自分を責めたくなったら、「それでも生き抜いてきた」と一度だけ認めます。",
        "私は、自分を責める代わりに、何がつらかったのかを見ます。"
      ],
      failure: [
        "失敗した私は、価値が下がった私ではなく、経験を得た私です。",
        "うまくいかなかったことを、人格ではなくデータとして扱います。",
        "今日の失敗を、明日の自分への材料に変えていきます。"
      ],
      tired: [
        "疲れている私は、怠けている私ではなく、回復を必要としている私です。",
        "何も進まない日にも、呼吸している私は十分にえらい。",
        "休むことは、止まることではなく、自分を続ける準備です。"
      ]
    };

    const labels = {
      anxiety: "不安のとき",
      selfBlame: "自己否定のとき",
      failure: "失敗したとき",
      tired: "疲れたとき"
    };

    const phraseEl = document.getElementById("phrase");
    const modeLabel = document.getElementById("modeLabel");
    const repeatText = document.getElementById("repeatText");
    const note = document.getElementById("note");
    const reframeResult = document.getElementById("reframeResult");

    let currentPhrase = "";

    function pick(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function setPhrase(text, label) {
      currentPhrase = text;
      modeLabel.textContent = label;
      phraseEl.textContent = text;
      repeatText.classList.remove("show");
      repeatText.textContent = "";
    }

    function showRandom() {
      setPhrase(pick(phrases), "今日の一言");
    }

    document.getElementById("randomBtn").addEventListener("click", showRandom);

    document.getElementById("repeatBtn").addEventListener("click", () => {
      repeatText.innerHTML = [currentPhrase, currentPhrase, currentPhrase]
        .map((text, index) => `${index + 1}. ${text}`)
        .join("<br>");
      repeatText.classList.add("show");
    });

    document.querySelectorAll("[data-mood]").forEach((button) => {
      button.addEventListener("click", () => {
        const mood = button.dataset.mood;
        setPhrase(pick(moodPhrases[mood]), labels[mood]);
      });
    });

    document.getElementById("reframeBtn").addEventListener("click", () => {
      const text = note.value.trim();
      if (!text) {
        reframeResult.textContent = "まず、今の気持ちを一言だけ入れてみてください。";
        return;
      }

      reframeResult.textContent =
        `「${text}」と思うくらい、今の私はつらさを感じている。` +
        " でも、その思考があることと、私の価値は別のもの。まずは今の私を見捨てずに、ここに戻ってきます。";
    });

    showRandom();
  </script>
</body>
</html>
